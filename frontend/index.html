<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skin Disease Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            max-width: 75%;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }

        .user {
            background: #DCF8C6;
            align-self: flex-end;
            margin-left: auto;
        }

        .bot {
            background: #eee;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            border: none;
            padding: 12px;
            font-size: 14px;
        }

        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 12px 16px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .typing {
            font-style: italic;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        Skin Disease Chatbot
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Hello! Describe your symptoms.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Enter symptoms...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");

    const userText = input.value.trim();
    if (!userText) return;

    // User message
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerText = userText;
    chatBox.appendChild(userMsg);

    input.value = "";

    // Typing indicator
    const typing = document.createElement("div");
    typing.className = "message bot typing";
    typing.innerText = "Analyzing...";
    chatBox.appendChild(typing);

    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: userText})
        });

        const data = await response.json();

        chatBox.removeChild(typing);

        const botMsg = document.createElement("div");
        botMsg.className = "message bot";
        botMsg.innerText = data.response;
        chatBox.appendChild(botMsg);

        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
        chatBox.removeChild(typing);

        const errorMsg = document.createElement("div");
        errorMsg.className = "message bot";
        errorMsg.innerText = "Error connecting to server.";
        chatBox.appendChild(errorMsg);
    }
}
</script>

</body>
</html>
